name: developer environment smoke check

on:
  pull_request:
    paths:
      - "tools/dev_doctor.py"
      - "README.md"
      - ".github/workflows/dev-doctor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: inspect CPU development environment
        run: python tools/dev_doctor.py --json
