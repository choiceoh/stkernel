# One verdict per pull request, so a collision between parallel sessions is visible before the merge and not after.
#
# This is useful even on a runner that cannot install everything: `tools/check.py` reports a module it could not
# import as CANNOT RUN, which does NOT set the exit code, while a test that actually ran and failed does. So the
# job fails for broken code and stays quiet about a missing wheel -- which is the distinction the tool exists for.
name: engine check

on:
  pull_request:
    # `launchers/**` is here because a launcher is code that runs before anything else can, and the
    # suite judges it: `tests/test_engine_bootpaths` and `test_st_deploy_watch` read those files and
    # run their snippets. On 2026-09-16 a one-line `[ -n "$X" ] && ...` went into `start-st-glm53.sh`
    # under `set -euo pipefail` -- false when the variable is unset, which is every production launch,
    # and a false last command ends the script. No workflow ran on that PR. It was caught by hand.
    # `probes/**` is here because a probe is found broken at GPU time otherwise: on 2026-09-19 one imported a tree the
    # single-GPU lane does not ship (#1210) and the cells lane died at its first line on a return shape two PRs had
    # changed (#1219). A PR that touched only `probes/` ran no workflow at all.
    paths: ["engine/**", "tests/**", "tools/**", "launchers/**", "probes/**", "bench/step_sim.py", "bench/storacle.py", "bench/oracle_records.py", ".github/workflows/engine-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A new push makes the verdict on the old head worthless, and it holds runners the new one is waiting for.
concurrency:
  group: engine-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Until 2026-09-19 this was one x64 runner and about eight minutes, six and a half of them in the verdict. Most of
    # that was torch's thread pool: a thread per core in each of four files at once, for tests that are thousands of
    # tiny ops. Now: one thread per file (check.py sets it; the env below covers the plain unittest steps), the verdict
    # cut into five parts on five runners, longest files first (tools/check_durations.json), and the three contract
    # steps on a sixth. The arm64 runner gives a public repository four physical cores where the x64 one's four vCPUs
    # are two SMT cores: the same 332 files summed 808 s there against 1,372 s on x64, the same tests run and skipped.
    # aarch64 is also what production runs.
    name: check ${{ matrix.part }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false                                  # every part reports: a red part does not hide another one
      matrix:
        part: ["1/5", "2/5", "3/5", "4/5", "5/5", contracts]
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        # No `cache: pip`. It was saved under each pull request's own ref, which no other pull request can read, so
        # every first run printed "pip cache is not found" -- and a hit would only have saved the download, about a
        # second. The time was pip compiling torch's bytecode: 21 of the step's 32 seconds. uv does not.
        with:
          python-version: "3.12"
      - name: dependencies that exist on a CPU runner
        # numpy and torch are the floor. `safetensors` and `triton` are here because without them
        # eight tests do not skip, they ERROR: both are imported inside a test body rather than at
        # module scope, so the CANNOT RUN rule above never sees them and a missing wheel reads as
        # broken code. Both install on a CPU runner -- the tests only need the import.
        run: |
          python -m pip install --quiet uv
          uv pip install --system numpy safetensors
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu || echo "no torch here: those files will report CANNOT RUN"
          uv pip install --system triton || echo "no triton here: the graph-contract tests will report FAILED, not CANNOT RUN"
      - name: the verdict, part ${{ matrix.part }}
        if: matrix.part != 'contracts'
        # `test_probe_*` is outside the verdict's default pattern (test_engine_*), so the CPU tests the probes do have
        # -- what they import, what their report lines take, their lanes in the kernel check -- never ran here.
        # `test_agent_tools` is check.py's own: how it reads a run, cuts the parts and slices a long file.
        run: python3 tools/check.py --pattern 'test_engine_*' --pattern 'test_probe_*' --pattern test_agent_tools --shard ${{ matrix.part }} --list
      # The contract steps stay plain `unittest` runs, where a module that fails to import fails the step -- the verdict
      # would call that CANNOT RUN and pass. Their own runner keeps their 35 s off the verdict's parts.
      - name: onepass recording and consumer measurement contracts
        if: matrix.part == 'contracts'
        run: python3 -m unittest discover -s tests -p 'test_onepass*.py'
      - name: the single-GPU lane's admission and its floor
        if: matrix.part == 'contracts'
        run: python3 -m unittest tests.test_fleet_single
      - name: CPU oracle replay and held-out validation contracts
        if: matrix.part == 'contracts'
        run: python3 -m unittest tests.test_step_tools tests.test_oracle_accuracy
