# One verdict per pull request, so a collision between parallel sessions is visible before the merge and not after.
#
# This is useful even on a runner that cannot install everything: `tools/check.py` reports a module it could not
# import as CANNOT RUN, which does NOT set the exit code, while a test that actually ran and failed does. So the
# job fails for broken code and stays quiet about a missing wheel -- which is the distinction the tool exists for.
name: engine check

on:
  pull_request:
    # `launchers/**` is here because a launcher is code that runs before anything else can, and the
    # suite judges it: `tests/test_engine_bootpaths` and `test_st_deploy_watch` read those files and
    # run their snippets. On 2026-09-16 a one-line `[ -n "$X" ] && ...` went into `start-st-glm53.sh`
    # under `set -euo pipefail` -- false when the variable is unset, which is every production launch,
    # and a false last command ends the script. No workflow ran on that PR. It was caught by hand.
    # `probes/**` is here because a probe is found broken at GPU time otherwise: on 2026-09-19 one imported a tree the
    # single-GPU lane does not ship (#1210) and the cells lane died at its first line on a return shape two PRs had
    # changed (#1219). A PR that touched only `probes/` ran no workflow at all.
    paths: ["engine/**", "tests/**", "tools/**", "launchers/**", "probes/**", "bench/step_sim.py", "bench/storacle.py", "bench/oracle_records.py", ".github/workflows/engine-check.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        # `cache: pip` keys on a dependency manifest, and this repo has none -- it ships an
        # image, not a package -- so setup-python does not skip the cache, it FAILS the job
        # before a line of the verdict runs. Both runs the workflow has ever had died here.
        # The dependency list is the two pip lines below, so key on the file they live in:
        # the cache is the torch CPU wheel, ~200 MB, and it changes when this file does.
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/engine-check.yml
      - name: dependencies that exist on a CPU runner
        # numpy and torch are the floor. `safetensors` and `triton` are here because without them
        # eight tests do not skip, they ERROR: both are imported inside a test body rather than at
        # module scope, so the CANNOT RUN rule above never sees them and a missing wheel reads as
        # broken code. Both install on a CPU runner -- the tests only need the import.
        run: |
          python -m pip install --upgrade pip
          pip install numpy safetensors
          pip install torch --index-url https://download.pytorch.org/whl/cpu || echo "no torch here: those files will report CANNOT RUN"
          pip install triton || echo "no triton here: the graph-contract tests will report FAILED, not CANNOT RUN"
      - name: the verdict
        run: python3 tools/check.py --list
      - name: the probes' own tests
        # `test_probe_*` is outside the verdict's default pattern (test_engine_*), so the CPU tests the probes do have
        # -- what they import, what their report lines take, their lanes in the kernel check -- never ran here.
        run: python3 tools/check.py --pattern 'test_probe_*' --list
      - name: onepass recording and consumer measurement contracts
        run: python3 -m unittest discover -s tests -p 'test_onepass*.py'
      - name: CPU oracle replay and held-out validation contracts
        run: python3 -m unittest tests.test_step_tools tests.test_oracle_accuracy
      - name: the single-GPU lane's admission and its floor
        run: python3 -m unittest tests.test_fleet_single
