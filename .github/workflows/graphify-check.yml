name: graphify snapshot check

on:
  pull_request:
    paths:
      - "engine/base/**"
      - "graphify-out/**"
      - "tools/graphify_engine_base.py"
      - "tools/graphify_engine_base.sh"
      - "tools/validate_graphify_engine_base.py"
      - ".github/workflows/graphify-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: validate committed engine graph
        run: python tools/validate_graphify_engine_base.py
